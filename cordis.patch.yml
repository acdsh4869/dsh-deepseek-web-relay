# ============================================================================
# dsh-deepseek-web-relay —— DSH bundle patch
# ============================================================================
# 这一行是「插件被 DSH 加载」的唯一开关。删掉这一行（或整行注释掉）并重启，
# 插件就彻底不加载了 —— 这就是紧急禁用手段之一，详见 README 第七节。
#
# 三处 id / name 必须完全一致：
#   - 本文件 insert 的 id 与 name
#   - package.json 的 "name"
#   - index.js 导出的 name
#
# 必须是「顶层 YAML 数组」。写成 mapping 会在启动时直接抛错，不是静默跳过。

- insert:
    - id: dsh-deepseek-web-relay
      name: dsh-deepseek-web-relay
